name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Vérifier ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.app }}

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: reservations
          POSTGRES_PASSWORD: reservations
          POSTGRES_DB: reservations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reservations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://reservations:reservations@localhost:5432/reservations

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier les types
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build