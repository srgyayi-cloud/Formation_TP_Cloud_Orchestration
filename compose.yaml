# Lance l'ensemble en local : docker compose up --build
# Interface : http://localhost:8080 — API : http://localhost:3000
# Base seule, pour développer sans conteneuriser l'API : docker compose up -d db
name: reservations

services:
  db:
    image: postgres:17-alpine
    environment:
      # Identifiants de développement local uniquement
      POSTGRES_USER: reservations
      POSTGRES_PASSWORD: reservations
      POSTGRES_DB: reservations
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservations -d reservations"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    # TODO (TP conteneurisation) : écrire backend/Dockerfile
    build:
      context: ./backend
      # TODO : transmettre la version à l'image
    # TODO : définir APP_VERSION, GIT_COMMIT et DATABASE_URL à l'exécution
    # TODO : attendre que la base soit prête avant de démarrer
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    environment:
      APP_VERSION: ${APP_VERSION:-1.0.0}
      API_URL: http://backend:3000
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
