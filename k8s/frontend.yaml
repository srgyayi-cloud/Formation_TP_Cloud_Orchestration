# ConfigMap : configuration de l'interface
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
data:
  APP_VERSION: "1.0.0"
  API_URL: "http://backend:3000"

---
# Deployment : l'interface (nginx sert la page et relaie /api vers l'API)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: reservations-frontend:1.0.0
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: frontend-config

---
# Service : adresse fixe "frontend:80"
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80